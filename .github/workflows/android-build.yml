name: Build Android APK

# Compila la app automáticamente en cada push y también se puede lanzar a mano
# desde la pestaña "Actions" de GitHub (botón "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (para Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (Angular/Ionic)
        run: npx ng build --configuration production

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      # Build de depuración: no necesita firma, sirve para probar en dispositivos
      # y para verificar que el proyecto compila en cada push.
      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

